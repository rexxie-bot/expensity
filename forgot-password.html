<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset password | Expensity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body" data-page="forgot">
<div class="wrap">
  <nav class="nav" aria-label="Main">
    <a class="logo" href="index.html">Expens<span>ity</span></a>
    <a class="back-link" href="login.html">&larr; Back to log in</a>
  </nav>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="title">
      <h1 id="title">Reset your <em class="hl">password</em></h1>
      <p class="sub">Enter the email or phone number you signed up with and we'll send reset instructions.</p>

      <form class="auth-form" id="forgot-form" novalidate>
        <div class="fg">
          <label for="fp-contact">Email or phone number</label>
          <input class="field" id="fp-contact" name="contact" type="text" inputmode="email" autocomplete="username" aria-describedby="err-fp-contact" placeholder="you@example.com or +234 801 234 5678">
          <p class="err-text" id="err-fp-contact" role="alert"></p>
        </div>

        <button class="btn" type="submit" id="submit-btn" data-label="Send reset instructions">Send reset instructions</button>
        <p class="msg" id="form-status" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-foot">Remembered it? <a href="login.html">Log in</a></p>
    </section>
  </main>
</div>
<script src="auth.js"></script>
</body>
</html>
